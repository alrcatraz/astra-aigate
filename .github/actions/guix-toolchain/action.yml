name: guix toolchain

# Prepare the declarative toolchain for the steps that follow: the pinned
# official NODE DIST (image parity — embedded as the first step), the Guix
# binary, the REPOSITORY channel pin (.guix/channels.scm), the cached channel
# checkout, and a wrapper script for the consumers:
#
#   - run: $GUIX_SHELL node …      # node from the image-identical dist,
#                                   # support tools from the Guix profile
#
# Runtime/support split (2026-10-02): the manifest deliberately carries NO
# node — CI runs the exact tarball the production image unpacks (see
# .github/actions/node-dist), so PATH inside the wrapper falls through to the
# dist and every consumer sees node 26.7.0 with the profile's git/rg/jq/python
# behind it. Embedding node-dist here keeps it a single-point opt-in: a job
# that activates this action gets both layers, and no job has to remember a
# second `uses:` line (audit finds zero copies to drift).
#
# Why a composite action instead of pasting these steps per job: the channel
# pin, the flag shape and the substitute assembly are each the product of a
# measured failure (see guix/ci/guix-to-work.md), and a drift between two
# copies of them reintroduces exactly the silent misconfiguration those notes
# paid for. One definition, many consumers.
#
# The pin is a file in the repository, NOT the installer's `channels` output.
# The output describes whatever nightly tarball is "latest" today — consuming
# it as the pin would let the environment drift daily, miss the checkout
# cache daily, and prove nothing about tomorrow's runs. (.guix/channels.scm
# documents the bump policy and procedure.)
#
# Ordering contract for consumers: the checkout cache is RESTORED here but
# saved by a trailing step in each consuming job (an action cannot save what
# the job only populates after the action returns). Jobs that skip the save
# step still work — they just pay a cold clone every run. Keep the pair:
#
#   - uses: ./.github/actions/guix-toolchain
#     with: { cache-url: ${{ secrets.GUIX_CACHE_URL }} }
#   …
#   - if: always()
#     uses: actions/cache/save@v4
#     with:
#       path: ~/.cache/guix
#       key: ${{ env.GUIX_CHECKOUT_CACHE_KEY }}
#
# Execution modes (2026-10): declaring jobs run in the CI executor container
# (ghcr.io/zhen-linhuo/reproducible-executors/executor-guixsd:v0.2.2 — public,
# no registry login), whose GuixSD system profile carries `guix` under
# /run/current-system/profile/bin. The detect step below finds it, puts it on
# PATH and skips the installer; on bare ubuntu-latest nothing preinstalled is
# found and the historical install path runs unchanged. In BOTH modes the
# environment resolves through `guix time-machine -C <repo pin>` — the
# container supplies the binary only, never the channel identity, so
# .guix/channels.scm + .guix/manifest.scm remain the single source of truth.
#
# Cost honesty: a container run pays no installer download — first run after
# a bump = incremental git fetch + store re-download (~5-13 min cold); a warm
# run should land near 2-4 minutes (substitutes for store drift only). The
# Ubuntu fallback still pays the installer download + systemd bring-up on top.

description: >-
  Pin the node dist (image parity), reuse a preinstalled Guix (executor
  container) or install it (bare Ubuntu), verify the repo pin, cache the
  checkout, export $GUIX_SHELL
author: alrcatraz
branding:
  icon: box
  color: purple

inputs:
  manifest:
    description: Manifest file the wrapper resolves (relative to the workspace)
    required: false
    default: .guix/manifest.scm
  cache-url:
    description: >-
      The project substitute cache URL, passed in by the CALLER from a secret
      (write `with: cache-url` using the secrets context on the calling side).
      A composite action cannot read `secrets` itself — that context does not
      exist inside action.yml (the runner rejects it at manifest load:
      "Unrecognized named-value: 'secrets'"), so the indirection must live on
      the calling side. Empty means no private cache: the list degrades to the
      public mirrors, so a missing secret never fails a job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # FIRST: detect a preinstalled Guix. The executor container keeps its
    # GuixSD system profile at /run/current-system/profile/bin, which is NOT
    # on the image's default PATH: prepend it (export for this step,
    # GITHUB_PATH for every later step — idempotent) so node-dist's curl and
    # every consumer resolve through it, and mark whether the install step
    # below must run. On bare ubuntu-latest the directory does not exist
    # (a nonexistent PATH entry is silently skipped) and no guix is found,
    # so the historical install path runs unchanged.
    - name: Detect preinstalled Guix (executor container)
      id: detect
      shell: bash
      run: |
        set -eu
        PROFILE_BIN=/run/current-system/profile/bin
        if [ -d "$PROFILE_BIN" ]; then
          case ":$PATH:" in
            *":$PROFILE_BIN:"*) : ;;                          # already on PATH
            *) echo "$PROFILE_BIN" >> "$GITHUB_PATH"; export PATH="$PROFILE_BIN:$PATH" ;;
          esac
        fi
        GUIX_BIN=$(command -v guix || true)
        if [ -n "$GUIX_BIN" ]; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          echo "executor container: guix at $GUIX_BIN ($("$GUIX_BIN" --version | head -1))"
          echo "the BINARY is a bootstrap only — the environment still resolves from .guix/channels.scm"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          echo "no preinstalled guix — using the bare-runner install path below"
        fi

    # The image-identical node runtime. It is guix-agnostic (works on
    # a bare runner), fails fast before the expensive installer runs, and
    # exports NODE_DIST_* plus a PATH whose head holds the dist's bin — the
    # wrapper below inherits it, so `$GUIX_SHELL node` resolves to the dist
    # once the manifest stops carrying node.
    - name: node dist (image-identical runtime)
      uses: ./.github/actions/node-dist

    # The installer ships a Guix binary snapshot plus the daemon/store
    # plumbing. Its own `channels` input and pull behaviour are NOT used: the
    # binary is only a bootstrap — everything that resolves packages runs
    # through `guix time-machine -C <repo pin>`, so the pinned channel
    # identity is authoritative regardless of which tarball landed this week.
    #
    # Source: this REPLACES PromyLOPh/guix-install-action@v1.6, which hardcodes
    #   https://ci.guix.gnu.org/search/latest/archive?...guix-binary.tar.xz
    # in its Download step with no `with:` override — when ci.guix.gnu.org
    # returns 502 (backend down, nginx up) every guix-toolchain job fails at
    # step 1 and cascades to Lint/Build/Docs/Security/Quality-Ratchet. The
    # sequence below is the upstream action's own install steps verbatim, only
    # the tarball source differs: Berkeley mirror's guix-binary-1.5.0.x86_64.
    # Per guix-to-work.md 定案 1 the tarball is only a bootstrap, so a release
    # binary boots the identical pinned env as nightly. Drop-in reversible:
    # restore the `uses:` line above to go back upstream.
    # Bare-Ubuntu fallback only: the executor container already carries guix
    # (detect step above) and this script assumes sudo + systemd — neither
    # exists in a job container.
    - name: Install Guix (Berkeley mirror, bare-Ubuntu fallback)
      if: steps.detect.outputs.preinstalled != 'true'
      shell: bash
      env:
        GUIX_TARBALL_URL: "https://mirrors.ocf.berkeley.edu/gnu/guix/guix-binary-1.5.0.x86_64-linux.tar.xz"
      run: |
        set -eu
        echo LANG=en_US.utf8 >> "$GITHUB_ENV"

        # Download + verify magic bytes are real xz (FD 37 7A 58 5A 00) so a
        # truncated/HTML-error body fails HERE, not steps later.
        wget -nv "$GUIX_TARBALL_URL" -O guix-binary.tar.xz
        head -c6 guix-binary.tar.xz | od -An -tx1 | tr -d ' \n' | grep -q '^fd377a585a00$' \
          || { echo "FATAL: downloaded file is not a valid xz tarball"; exit 1; }
        echo "guix tarball OK: $(du -h guix-binary.tar.xz | cut -f1)"

        sudo -- tar --extract --file guix-binary.tar.xz -C / --no-overwrite-dir
        sudo -- groupadd --system guixbuild || true
        for i in $(seq -w 1 10); do
          sudo useradd -g guixbuild -G guixbuild -d /var/empty -s "$(which nologin)" -c "Guix build user $i" --system "guixbuilder${i}" 2>/dev/null || true
        done

        GUIX_PATH=/var/guix/profiles/per-user/root/current-guix
        sudo cp "$GUIX_PATH/lib/systemd/system/gnu-store.mount" /etc/systemd/system/
        sudo tee /etc/systemd/system/guix-daemon.service > /dev/null <<'SERVICE'
        # This is a "service unit file" for the systemd init system to launch
        # 'guix-daemon'.  Drop it in /etc/systemd/system or similar to have
        # 'guix-daemon' automatically started.

        [Unit]
        Description=Build daemon for GNU Guix

        [Service]
        ExecStart=/var/guix/profiles/per-user/root/current-guix/bin/guix-daemon \
            --build-users-group=guixbuild --discover=yes
        Environment='GUIX_LOCPATH=/var/guix/profiles/per-user/root/guix-profile/lib/locale' LC_ALL=en_US.utf8

        StandardOutput=syslog
        StandardError=syslog

        # Work around a nasty systemd ‘feature’ that kills the entire process tree
        # (including the daemon!) if any child, such as cc1plus, runs out of memory.
        OOMPolicy=continue

        # Despite the name, this is rate-limited: a broken daemon will eventually fail.
        Restart=always

        # See <https://lists.gnu.org/archive/html/guix-devel/2016-04/msg00608.html>.
        # Some package builds (for example, go@1.8.1) may require even more than
        # 1024 tasks.
        TasksMax=8192

        [Install]
        WantedBy=multi-user.target
        SERVICE
        sudo chmod 664 /etc/systemd/system/gnu-store.mount /etc/systemd/system/guix-daemon.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now gnu-store.mount guix-daemon.service

        # Authorize the build farm's public keys + generate a signing key
        # (upstream action's Authorize/Generate-keys steps).
        for F in "$GUIX_PATH"/share/guix/*.pub; do
          sudo "$GUIX_PATH/bin/guix" archive --authorize < "$F"
        done
        sudo "$GUIX_PATH/bin/guix" archive --generate-key

        echo "$GUIX_PATH/bin" >> "$GITHUB_PATH"
        echo "guix installed from Berkeley mirror"

    # Executor-container leg of the same contract: the image ships no running
    # daemon (its entrypoint is `tail -f /dev/null`, no init) and writes no
    # substitute trust (/etc/guix does not exist until authorized) — both are
    # the systemd unit's job on the Ubuntu path. `guix gc --list-roots` is
    # the daemon health probe (this Guix build exposes no `guix store ping`
    # subcommand — measured locally in image v0.2.2). A daemon started here
    # survives across steps: each step is a fresh `exec` into the SAME
    # container.
    - name: Authorize substitutes + start guix-daemon (executor container)
      id: daemon
      if: steps.detect.outputs.preinstalled == 'true'
      shell: bash
      env:
        CACHE_URL: ${{ inputs.cache-url }}
      run: |
        set -eu
        # The runner starts this container with `--entrypoint tail`: no boot, no
        # shepherd, so /var/guix/daemon-socket/socket never exists until something
        # starts the daemon. Every job therefore starts it here, in the shape the
        # image's own build workflow uses. Authorize first — without the ACL the
        # client refuses every substitute regardless of source — and give the
        # daemon a signing keypair, as the image project's stage 1 does.
        for F in /run/current-system/profile/share/guix/*.pub; do
          guix archive --authorize < "$F"
        done
        if timeout 30 guix archive --generate-key; then
          echo "daemon keypair generated"
        else
          echo "::warning title=generate-key failed::rc=$? — daemon has no signing keypair"
        fi

        # Same list, same order as the wrapper step: the private cache leads
        # because Guix queries in sequence and stops at the first hit, the public
        # mirrors fall back. (Reachability caveat for a home-served cache is
        # documented in guix/ci/guix-to-work.md — GitHub-hosted runners have no
        # IPv6 egress.)
        PUBLIC_URLS="https://mirror.sjtu.edu.cn/guix/ https://bordeaux.guix.gnu.org https://ci.guix.gnu.org"
        if [ -n "${CACHE_URL:-}" ]; then SUBS="$CACHE_URL $PUBLIC_URLS"; else SUBS="$PUBLIC_URLS"; fi
        printf '%s' "$SUBS" > /tmp/guix-subs.txt

        # Deliberately NOT --allow-aslr: the job runs --privileged, so
        # personality(ADDR_NO_RANDOMIZE) IS available and guix disables ASLR
        # itself — the reproducible default. --allow-aslr would tell guix to
        # build with ASLR on, i.e. accept non-reproducible output for no reason
        # (and as an argument to `guix time-machine` it is rejected outright as
        # unrecognized — it is a daemon flag only).
        # fds to a file, stdin from /dev/null: a plain `&` already survives
        # across steps, but binding the daemon's output to this step's pipe is
        # what makes its death invisible later.
        export SSL_CERT_FILE="${SSL_CERT_FILE:-/run/current-system/profile/etc/ssl/certs/ca-certificates.crt}"
        guix-daemon --build-users-group=guixbuild --substitute-urls="$SUBS" \
          >/tmp/guix-daemon.log 2>&1 </dev/null &
        DAEMON_PID=$!
        ready=""
        for i in $(seq 1 30); do
          if [ -S /var/guix/daemon-socket/socket ] && kill -0 "$DAEMON_PID" 2>/dev/null; then
            ready=1; echo "guix-daemon up after ${i}s (PID $DAEMON_PID)"; break
          fi
          if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
            echo "FATAL: guix-daemon exited while starting — log:"; cat /tmp/guix-daemon.log; exit 1
          fi
          if [ "$i" = 30 ]; then
            echo "FATAL: no daemon socket after 30s — log:"; cat /tmp/guix-daemon.log; exit 1
          fi
          sleep 1
        done
        # Readiness is socket-exists AND pid-alive. `guix gc --list-roots` is
        # NOT a readiness test: it returns 0 with no daemon at all (it reads the
        # local gcroot symlinks), which is exactly how the previous version of
        # this step printed "already responding" in 313 ms and started nothing,
        # leaving every job to die at the first time-machine call.
        [ -n "$ready" ] || { echo "FATAL: daemon readiness loop exited unexpectedly"; exit 1; }
        guix gc --list-roots >/dev/null 2>&1 && echo "client RPC reaches the daemon" \
          || echo "::warning title=client RPC check::guix gc --list-roots failed though the socket exists"

    # Canary for the container-side risk that a local probe could confirm but
    # not fix unilaterally (2026-10-22, image v0.2.2): `guix time-machine`
    # sets personality(ADDR_NO_RANDOMIZE) and refuses to run if that fails
    # ("ADDR_NO_RANDOMIZE appears blocked … --allow-aslr was not passed").
    # Docker's default seccomp profile allows personality only for
    # {0, 8, 131072, 131080, 4294967295} (moby profiles/seccomp/default.json,
    # v27.5.1) — 0x40000 is not among them. RESOLVED: every container job now
    # runs `options: --privileged`, which lifts seccomp and also grants the
    # CAP_SYS_ADMIN the daemon's build sandbox needs (clone(2)) — the same
    # shape the image project's own build workflow uses, where
    # `seccomp=unconfined` alone was found insufficient because it lifts the
    # syscall filter but not the capability. --allow-aslr is deliberately NOT
    # passed: with seccomp lifted guix disables ASLR itself, and that flag
    # would accept non-reproducible builds instead. The probe stays as a
    # one-line fact check — if it ever reports "blocked" again, something
    # regressed the options block.
    - name: ASLR/personality canary (container seccomp)
      if: steps.detect.outputs.preinstalled == 'true'
      shell: bash
      run: |
        if python3 -c 'import ctypes,sys; sys.exit(0 if ctypes.CDLL("libc.so.6",use_errno=True).personality(0x40000)!=-1 else 1)' 2>/dev/null; then
          echo "personality(ADDR_NO_RANDOMIZE) OK — seccomp does not block it on this runner"
        else
          echo "::warning title=ADDR_NO_RANDOMIZE blocked by container seccomp::guix time-machine will refuse at the first \$GUIX_SHELL step ('ADDR_NO_RANDOMIZE appears blocked ... was not passed'). Options: A=container.options --security-opt seccomp=unconfined (runtime fix, preferred); B=--allow-aslr (weakens reproducibility, needs sign-off); C=derived image with adjusted seccomp profile. See the ci.yml header note."
        fi

    - name: Verify the repository channel pin
      id: pin
      shell: bash
      env:
        CHANNELS_FILE: ${{ github.workspace }}/.guix/channels.scm
      run: |
        set -eu
        # Fail loudly HERE rather than as an opaque Scheme error three steps
        # later. A pin without an `introduction` cannot be authenticated; a
        # pin whose commit is not a full 40-hex SHA resolves unpredictably.
        test -f "$CHANNELS_FILE" || { echo "FATAL: $CHANNELS_FILE missing — the toolchain pin must live in the repo"; exit 1; }
        grep -qE '\(commit[[:space:]]*"[0-9a-f]{40}"\)' "$CHANNELS_FILE" || { echo "FATAL: channel pin carries no 40-hex commit"; exit 1; }
        grep -q 'introduction'  "$CHANNELS_FILE" || { echo "FATAL: channel pin is not authenticated"; exit 1; }

        # The checkout cache key is derived from the pin file's own content:
        # edit the pin and the key moves with it — no second place to update,
        # and a stale key can never serve a checkout for a different pin than
        # the one being resolved.
        pin_hash=$(sha256sum "$CHANNELS_FILE" | cut -c1-16)
        echo "cachekey=guix-checkouts-v1-$pin_hash" >> "$GITHUB_OUTPUT"
        {
          printf 'GUIX_CHECKOUT_CACHE_KEY<<EOF\n%s\nEOF\n' "guix-checkouts-v1-$pin_hash"
          printf 'GUIX_CHANNELS_FILE<<EOF\n%s\nEOF\n' "$CHANNELS_FILE"
        } >> "$GITHUB_ENV"
        echo "channel pin: $CHANNELS_FILE (cache key …$pin_hash)"

    # In the executor container HOME points at the runner-provided home
    # mount, so `~/.cache/guix` resolves the same way there; the key stays
    # derived from the scm pin — no key change for the container migration.
    # The channel checkout under ~/.cache/guix is owned by the runner user
    # (measured, run 36863496262: runner:runner, 571M) — unlike /gnu/store,
    # which is root-owned and whose absolute-path restore fails outright (the
    # install action's own tests say so; actions/cache #133 et al.). Caching
    # the checkout removes the 8-minute clone: the dominant cold-start cost.
    # `restore-keys` deliberately includes the bare version prefix: after a
    # bump, the old checkout is restored and Guix fetches the new commit
    # incrementally into it, instead of re-cloning the full history.
    - name: Restore channel checkout cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/guix
        key: ${{ steps.pin.outputs.cachekey }}
        restore-keys: |
          ${{ steps.pin.outputs.cachekey }}
          guix-checkouts-v1-

    - name: Assemble the Guix wrapper
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        CACHE_URL: ${{ inputs.cache-url }}
        CHANNELS_FILE: ${{ github.workspace }}/.guix/channels.scm
      run: |
        set -eu

        # Substitute order matters: Guix queries in sequence and stops at the
        # first hit. The private cache leads because it carries what the public
        # mirrors lack (this project's own channels), and the public servers
        # stay as the fallback. It is a SECRET, not a literal and not a
        # configuration variable: the URL names infrastructure, a variable's
        # value is neither write-only nor masked in public run logs, and this
        # step prints the assembled command for verification.
        #
        # Reachability note: a home-served cache is typically IPv6-only, while
        # GitHub-hosted runners have no IPv6 egress — see
        # guix/ci/guix-to-work.md before expecting a private URL to work here.
        PUBLIC_URLS="https://mirror.sjtu.edu.cn/guix/ https://bordeaux.guix.gnu.org https://ci.guix.gnu.org"
        if [ -n "${CACHE_URL:-}" ]; then
          SUBS="$CACHE_URL $PUBLIC_URLS"
          echo "substitute sources: private cache first, then public mirrors"
        else
          SUBS="$PUBLIC_URLS"
          echo "NOTE: no cache secret configured — substituting from public mirrors only."
        fi

        # `--substitute-urls` carries a WHITESPACE-separated list, so the
        # value must arrive at Guix as ONE argv element. Consumers expand the
        # wrapper UNQUOTED (`$GUIX_SHELL node …`), and shell word-splitting
        # does not re-interpret quotes that live inside an expanded value —
        # a quote embedded in a pre-assembled word string is a literal
        # character, gets split off, and Guix sees `--substitute-urls=<first>`
        # plus the remaining URLs as extra arguments:
        #
        #   guix time-machine: error: https://ci.guix.gnu.org': extraneous argument
        #                                       ^ trailing quote, from $SUBS
        #
        # (same failure as Guix bug #29814, which reports this exact message).
        # Fixed by writing a SCRIPT: inside it the quotes are real syntax, so
        # the list stays one argv element no matter how the caller expands
        # $GUIX_SHELL. The script is a single word, so unquoted expansion
        # cannot break it either.
        #
        # The script resolves the manifest relative to $GITHUB_WORKSPACE and
        # the channel file by absolute path, so consumers may run it from any
        # working directory.
        SCRIPT="$GITHUB_ACTION_PATH/guix-shell.sh"
        MANIFEST_ABS="$GITHUB_WORKSPACE/$MANIFEST"
        mkdir -p "$GITHUB_ACTION_PATH"
        cat > "$SCRIPT" <<WRAP_EOF
        #!/usr/bin/env bash
        # Generated by the guix-toolchain action — do not edit.
        # Single entry point: Guix invoked with the pinned channel and the
        # assembled substitute list, forwarding all caller arguments.
        exec guix time-machine \\
          -C '$CHANNELS_FILE' \\
          --substitute-urls='$SUBS' \\
          -- shell \\
            -m '$MANIFEST_ABS' \\
            --substitute-urls='$SUBS' \\
            -- "\$@"
        WRAP_EOF
        chmod +x "$SCRIPT"

        # The MANIFEST/CACHE_URL/CHANNELS_FILE references above are written by
        # THIS shell (the heredoc is unquoted), so they expand here. Verify
        # that: a surviving `$SUBS` or `$CHANNELS_FILE` means the heredoc
        # quoting went wrong and every later step would fail at Guix parse.
        # Search for the token WITHOUT a backslash — an unexpanded reference
        # arrives as `$SUBS`, and grepping for `\$SUBS` would never match it
        # (a probe that cannot fail is no probe at all).
        for probe in '$SUBS' '$CHANNELS_FILE' '$MANIFEST'; do
          if grep -qF -- "$probe" "$SCRIPT"; then
            echo "FATAL: unexpanded $probe survived into the wrapper script"
            exit 1
          fi
        done
        # `"$@"` is the one intentional reference; prove it survived.
        grep -qF -- '"$@"' "$SCRIPT" || { echo "FATAL: caller args not forwarded"; exit 1; }
        bash -n "$SCRIPT" || { echo "FATAL: wrapper script is not valid bash"; exit 1; }

        # Multi-word values need the heredoc form; `NAME=value` is split on
        # spaces when the next step receives it. GUIX_SHELL is a single path
        # (no spaces on runners), GUIX_SUBSTITUTE_URLS keeps the list for
        # diagnostics and for jobs that assemble their own invocation.
        {
          printf 'GUIX_SHELL<<EOF\n%s\nEOF\n' "$SCRIPT"
          printf 'GUIX_SUBSTITUTE_URLS<<EOF\n%s\nEOF\n' "$SUBS"
        } >> "$GITHUB_ENV"

        echo "wrapper: $SCRIPT"
        echo "  manifest: $MANIFEST_ABS"
        echo "  substitute sources: $(echo "$SUBS" | wc -w)"
