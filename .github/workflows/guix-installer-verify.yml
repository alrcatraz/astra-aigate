name: guix-installer-verify

# VERIFY: Berkeley guix-binary-1.5.0 as the CI Guix installer source.
# PromyLOPh/guix-install-action hardcodes ci.guix.gnu.org (currently 502) with no
# input override, so this workflow replicates its exact install sequence but pulls
# the tarball from the Berkeley mirror, then runs the SAME downstream chain the
# production guix-toolchain action does (repo channel pin -> time-machine -> manifest).
# Green = safe to swap the production action's installer source. Red = try 1.4.0 or wait
# for ci.guix.gnu.org. Manual dispatch only — never blocks the main CI gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # VERIFY: Guix installer source (Berkeley mirror). Isolated smoke job proving the
  # Berkeley guix-binary-1.5.0 tarball boots the full pinned toolchain BEFORE the
  # production guix-toolchain action is touched (it hardcodes ci.guix.gnu.org = 502).
  # Replicates PromyLOPh/guix-install-action's exact install sequence but pulls from
  # Berkeley, then runs the SAME downstream chain (repo pin -> time-machine -> manifest).
  # green = safe to swap the production action; red = try 1.4.0 or wait.
  verify-installer:
    name: "VERIFY: Guix installer from Berkeley mirror"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: node dist (image parity)
        uses: ./.github/actions/node-dist

      - name: Install Guix (Berkeley mirror, inline)
        shell: bash
        env:
          GUIX_TARBALL_URL: "https://mirrors.ocf.berkeley.edu/gnu/guix/guix-binary-1.5.0.x86_64-linux.tar.xz"
        run: |
          set -eu
          echo LANG=en_US.utf8 >> "$GITHUB_ENV"
          wget -nv "$GUIX_TARBALL_URL" -O guix-binary.tar.xz
          head -c6 guix-binary.tar.xz | od -An -tx1 | tr -d ' \n' | grep -q '^fd377a585a00$' \
            || { echo "FATAL: not a valid xz tarball"; exit 1; }
          echo "guix tarball OK: $(du -h guix-binary.tar.xz | cut -f1)"
          sudo -- tar --extract --file guix-binary.tar.xz -C / --no-overwrite-dir
          sudo -- groupadd --system guixbuild || true
          for i in $(seq -w 1 10); do
            sudo useradd -g guixbuild -G guixbuild -d /var/empty -s "$(which nologin)" -c "Guix build user $i" --system "guixbuilder${i}" 2>/dev/null || true
          done
          GUIX_PATH=/var/guix/profiles/per-user/root/current-guix
          sudo cp "$GUIX_PATH/lib/systemd/system/gnu-store.mount" /etc/systemd/system/
          sudo tee /etc/systemd/system/guix-daemon.service > /dev/null <<'SERVICE'
              # This is a "service unit file" for the systemd init system to launch
              # 'guix-daemon'.  Drop it in /etc/systemd/system or similar to have
              # 'guix-daemon' automatically started.

              [Unit]
              Description=Build daemon for GNU Guix

              [Service]
              ExecStart=/var/guix/profiles/per-user/root/current-guix/bin/guix-daemon \
                  --build-users-group=guixbuild --discover=yes
              Environment='GUIX_LOCPATH=/var/guix/profiles/per-user/root/guix-profile/lib/locale' LC_ALL=en_US.utf8

              StandardOutput=syslog
              StandardError=syslog

              # Work around a nasty systemd ‘feature’ that kills the entire process tree
              # (including the daemon!) if any child, such as cc1plus, runs out of memory.
              OOMPolicy=continue

              # Despite the name, this is rate-limited: a broken daemon will eventually fail.
              Restart=always

              # See <https://lists.gnu.org/archive/html/guix-devel/2016-04/msg00608.html>.
              # Some package builds (for example, go@1.8.1) may require even more than
              # 1024 tasks.
              TasksMax=8192

              [Install]
              WantedBy=multi-user.target
          SERVICE
          sudo chmod 664 /etc/systemd/system/gnu-store.mount /etc/systemd/system/guix-daemon.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now gnu-store.mount guix-daemon.service
          echo "$GUIX_PATH/bin" >> "$GITHUB_PATH"
          echo "guix installed from Berkeley mirror"

      - name: Authorize build farm + generate key
        shell: bash
        run: |
          set -eu
          GUIX_BIN=/var/guix/profiles/per-user/root/current-guix/bin
          for F in /var/guix/profiles/per-user/root/current-guix/share/guix/*.pub; do
            sudo "$GUIX_BIN/guix" archive --authorize < "$F"
          done
          sudo "$GUIX_BIN/guix" archive --generate-key

      - name: Verify repository channel pin
        shell: bash
        env:
          CHANNELS_FILE: ${{ github.workspace }}/.guix/channels.scm
        run: |
          set -eu
          test -f "$CHANNELS_FILE" || { echo "FATAL: channels.scm missing"; exit 1; }
          grep -qE '\(commit[[:space:]]*"[0-9a-f]{40}"\)' "$CHANNELS_FILE" || { echo "FATAL: no 40-hex commit"; exit 1; }
          grep -q 'introduction' "$CHANNELS_FILE" || { echo "FATAL: unauthenticated pin"; exit 1; }
          echo "channel pin OK"

      - name: Manifest resolves through time-machine (THE real test)
        shell: bash
        env:
          CHANNELS_FILE: ${{ github.workspace }}/.guix/channels.scm
          MANIFEST_ABS: ${{ github.workspace }}/.guix/manifest.scm
        run: |
          set -eu
          export PATH="/var/guix/profiles/per-user/root/current-guix/bin:$PATH"
          SUBS="https://mirror.sjtu.edu.cn/guix/ https://bordeaux.guix.gnu.org https://ci.guix.gnu.org"
          echo "=== guix version (from Berkeley tarball) ==="
          guix --version | head -1
          echo "=== time-machine resolves repo pin -> manifest ==="
          guix time-machine -C "$CHANNELS_FILE" \
            --substitute-urls="$SUBS" \
            -- shell -m "$MANIFEST_ABS" --substitute-urls="$SUBS" \
            -- sh -c 'set -eu; git --version; rg --version | head -1; jq --version; python3 --version; echo "MANIFEST RESOLVE OK"'
