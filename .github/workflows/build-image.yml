# Build & push the astra-aigate container image to GHCR.
#
# Triggers:
#   - push tag v*        → ghcr.io/alrcatraz/astra-aigate:vX.Y.Z + :latest
#   - workflow_dispatch  → manual build (optional `target` input)
#
# Images are built from RELEASE TAGS ONLY. A branch push never publishes: an
# image is the deployable artefact, so it must correspond to a versioned,
# reviewed state on `main` — not to whatever an integration branch happens to
# hold. Tag the release on `main`, then the tag drive the build.
#
# The image builds on the openSUSE Leap 16.0 base (see Dockerfile). The webpack
# build step needs ~8 GB of V8 heap, which is why AIGATE_BUILD_MEMORY_MB=8192
# is passed through. GitHub-hosted ubuntu-latest runners (16 GB) can run this
# in a single job; the dedicated manual build machine remains the fallback
# for local verification.
#
# Self-hosted CI is intentionally NOT configured (2026-08-06): the
# on-premises runner has limited performance for a 20-minute openSUSE
# image build. Revisit if the hardware is upgraded or a stronger runner
# becomes available.

name: Build Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Docker target (default: runner-cli, i.e. the final stage)"
        required: false
        default: "runner-cli"
      version:
        description: "Version tag for a manual build (default: derived from the checked-out commit)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/alrcatraz/astra-aigate

jobs:
  build:
    # Observation-only environment (no branch/tag restrictions, no reviewers):
    # records each publish as a deployment on the Environments page. The
    # release-only gate stays in the workflow layer — the `on.push.tags`
    # trigger and the Resolve-image-tags step — because that is reviewable
    # in code and must keep allowing manual workflow_dispatch builds.
    environment: production
    runs-on: ubuntu-latest
    # GHCR publishing is GitHub-Actions-only by design (2026-09-25): a
    # non-GitHub runner cannot authenticate to ghcr.io (its workflow JWT is
    # scoped to its own platform). Consumers outside GitHub pull images from
    # GHCR/releases.
    if: github.server_url == 'https://github.com'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve image tags
        id: tags
        run: |
          set -eu
          # Only release tags publish. A tag push carries vX.Y.Z; a manual
          # dispatch may name a version explicitly, or reuse the tag pointing
          # at the checked-out commit. Anything else is a hard error — never
          # publish an image under a branch name.
          REF_NAME="${{ github.ref_name }}"
          INPUT_VERSION="${{ inputs.version }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION="$REF_NAME"
          else
            VERSION=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          if [[ "$VERSION" != v* ]]; then
            echo "::error::No version tag resolved (ref='$REF_NAME'). Publishing requires a v* tag: tag the commit on main, or pass the 'version' input on a manual dispatch."
            exit 1
          fi
          echo "tags=${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "publishing ${IMAGE_NAME}:${VERSION} and :latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Evidence chain for the base image (2026-10-02 decision: the leap:16.0
      # tag floats ON PURPOSE — it is how openSUSE delivers security patches
      # into the image, and freezing a snapshot tag would freeze the CVE set
      # with it). Reproducibility here means RECORDING what each build
      # actually ran on: the registry manifest digest for the tag, captured
      # over a HEAD request (no layer pulls) right before the build. If a
      # later run behaves differently, this line says which base it had.
      - name: Record base image digest (floating leap:16.0 evidence)
        shell: bash
        run: |
          set -eu
          BASE_IMAGE=$(grep -m1 '^FROM ' Dockerfile | awk '{print $2}')
          echo "base image reference: $BASE_IMAGE"
          REPO=$(echo "$BASE_IMAGE" | sed -E 's#^[^/]+/##; s#:.*$##; s#@.*$##')
          REF=$(echo "$BASE_IMAGE" | sed -E 's#^.*:##; s#@.*$##')
          # Anonymous HEAD works on this registry (proved locally 2026-10-02:
          # 200 + Docker-Content-Digest, no /v2/token needed — that endpoint
          # 400s here anyway). -f makes any HTTP error fail the step loudly.
          DIGEST=$(curl -fsSI \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry.opensuse.org/v2/$REPO/manifests/$REF" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2; exit}')
          if [ -n "$DIGEST" ]; then
            echo "base digest at build time: ${BASE_IMAGE%@*}@$DIGEST"
            echo "- base image: \`${BASE_IMAGE%@*}@$DIGEST\` (resolved ${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARN: registry did not return a manifest digest — evidence line missing" >&2
            echo "- base image: \`$BASE_IMAGE\` — digest lookup FAILED (${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target || 'runner-cli' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            AIGATE_BUILD_MEMORY_MB=8192
          cache-from: type=gha
          cache-to: type=gha,mode=max
